<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar filme · Catálogo de Filmes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="index.html">← voltar ao catálogo</a>

    <div class="masthead" style="border-bottom:none; padding-bottom:0;">
      <div>
        <h1>Registrar filme</h1>
        <p class="subtitle">nova ficha de acervo</p>
      </div>
    </div>

    <form class="card" id="form-cadastro" novalidate>
      <div class="field">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" required autocomplete="off" />
      </div>

      <div class="field">
        <label for="genero">Gênero</label>
        <input type="text" id="genero" name="genero" placeholder="Ex.: Drama, Ação, Infantil/Fantasia" required autocomplete="off" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="duracao">Duração</label>
          <input type="text" id="duracao" name="duracao" placeholder="Ex.: 1 horas 44 minutos" required autocomplete="off" />
        </div>

        <div class="field">
          <label for="classificacao">Classificação etária</label>
          <input type="number" id="classificacao" name="classificacao_etaria" min="0" step="1" placeholder="0" required />
          <p class="hint">use 0 para classificação livre</p>
        </div>
      </div>

      <div class="banner" id="banner"></div>

      <div class="form-actions">
        <a class="btn btn-quiet" href="index.html">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar filme</button>
      </div>
    </form>
  </main>

  <script src="api.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
