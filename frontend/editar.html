<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar filme · Catálogo de Filmes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <a class="back-link" href="index.html">← voltar ao catálogo</a>

    <div class="masthead" style="border-bottom:none; padding-bottom:0;">
      <div>
        <h1>Editar filme</h1>
        <p class="subtitle" id="ficha-numero">ficha de acervo</p>
      </div>
    </div>

    <div class="state" id="loading">
      <strong>Carregando</strong>
      Buscando os dados do filme…
    </div>

    <form class="card" id="form-editar" novalidate hidden>
      <div class="field">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" required autocomplete="off" />
      </div>

      <div class="field">
        <label for="genero">Gênero</label>
        <input type="text" id="genero" name="genero" required autocomplete="off" />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="duracao">Duração</label>
          <input type="text" id="duracao" name="duracao" required autocomplete="off" />
        </div>

        <div class="field">
          <label for="classificacao">Classificação etária</label>
          <input type="number" id="classificacao" name="classificacao_etaria" min="0" step="1" required />
          <p class="hint">use 0 para classificação livre</p>
        </div>
      </div>

      <div class="banner" id="banner"></div>

      <div class="form-actions">
        <a class="btn btn-quiet" href="index.html">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
      </div>
    </form>

    <div class="state" id="not-found" hidden>
      <strong>Filme não encontrado</strong>
      A ficha solicitada não existe mais no catálogo.
    </div>
  </main>

  <script src="api.js"></script>
  <script src="editar.js"></script>
</body>
</html>
